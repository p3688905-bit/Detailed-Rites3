<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>禮記·曲禮 ～ 風雅敘事 ～</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-tc@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-tc@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-tc@5/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng@5/400.css">
<style>
:root{
  --ink:#16120f; --paper:#e9dcc0; --gold:#c2a05c; --gold2:#8d6f38; --seal:#9c2b23;
  --posL:420px; --posC:700px; --posR:980px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0908;overflow:hidden;font-family:"Noto Serif TC","Songti TC",serif;color:var(--paper)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(ellipse at 50% 40%,#1b1512 0%,#0b0908 70%)}
#stage{position:absolute;width:1280px;height:720px;left:50%;top:50%;transform-origin:50% 50%;
  background:#0e0b09;overflow:hidden;box-shadow:0 0 0 2px #3a2f22,0 0 0 6px #1a1512,0 30px 90px rgba(0,0,0,.9)}
.layer{position:absolute;inset:0}
#bgLayer{z-index:1}
#bgLayer svg{width:100%;height:100%;display:block}
.bgFade{animation:bgIn 1.1s ease both}
@keyframes bgIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}

#grain{pointer-events:none;z-index:5;background:
  radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 58%,rgba(0,0,0,.32) 100%);
  mix-blend-mode:multiply;opacity:.8}
#grain:after{content:"";position:absolute;inset:0;opacity:.05;background-image:
  repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 4px)}

#fx{pointer-events:none;z-index:2}

/* ============ 立繪位置（已修正：left 由 JS 直接寫入，絕不落在左緣） ============ */
#charLayer{pointer-events:none;z-index:20}
.char{position:absolute;bottom:170px;height:500px;width:215px;overflow:visible;
  left:var(--posC);transform:translateX(-50%);opacity:0;
  transition:left .5s cubic-bezier(.2,.8,.25,1),opacity .45s,filter .45s;
  filter:drop-shadow(0 12px 16px rgba(0,0,0,.4))}
.char.on{opacity:1}
.char.dim{filter:brightness(.62) saturate(.78) drop-shadow(0 12px 16px rgba(0,0,0,.4))}
.char svg{width:100%;height:100%;display:block;overflow:visible;animation:breathe 4.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.char.posL{left:var(--posL)}
.char.posC{left:var(--posC)}
.char.posR{left:var(--posR)}
.pop{animation:pop .5s ease both}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(18px) scale(.98)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

/* ---- 狀態列 ---- */
#hud{position:absolute;left:16px;top:12px;display:flex;gap:7px;z-index:40}
.stat{width:46px;padding:3px 0 4px;text-align:center;background:linear-gradient(#2a201a,#170f0c);
  border:1px solid #6d5a38;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(194,160,92,.22),0 3px 8px rgba(0,0,0,.5)}
.stat b{display:block;font-family:"Ma Shan Zheng",serif;font-size:18px;color:var(--gold);line-height:1.1}
.stat i{display:block;font-style:normal;font-size:9px;letter-spacing:1px;color:#a08c66;margin-top:1px}
.stat.up{animation:statUp .6s ease}
@keyframes statUp{0%{transform:translateY(0)}30%{transform:translateY(-6px);filter:brightness(1.6)}100%{transform:translateY(0)}}

/* ---- 選單列 ---- */
#menubar{position:absolute;right:12px;top:10px;display:flex;gap:5px;z-index:60;flex-wrap:nowrap}
.mb{font-family:"Noto Serif TC",serif;font-size:12px;letter-spacing:1px;color:#d8c69c;background:linear-gradient(#241b15,#150f0c);
  border:1px solid #6d5a38;padding:4px 9px;border-radius:3px;cursor:pointer;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.5);white-space:nowrap}
.mb:hover{color:#fff3d6;border-color:var(--gold);background:linear-gradient(#3a2c1e,#20170f);transform:translateY(-1px)}
.mb.act{color:#1a120b;background:linear-gradient(#d8bd84,#b0904f);border-color:#e5d3a4}

/* ---- 對話框 ---- */
#dialog{position:absolute;left:0;right:0;bottom:0;height:176px;z-index:30;cursor:pointer}
#dbox{position:absolute;left:26px;right:26px;bottom:12px;height:152px;
  background:linear-gradient(180deg,rgba(20,15,12,.9),rgba(12,9,7,.96));
  border:1px solid rgba(194,160,92,.55);border-radius:4px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 40px rgba(194,160,92,.07),0 -6px 30px rgba(0,0,0,.5);
  padding:20px 36px 14px}
#dbox:before,#dbox:after{content:"";position:absolute;width:24px;height:24px;border:2px solid rgba(194,160,92,.75)}
#dbox:before{left:6px;top:6px;border-right:0;border-bottom:0}
#dbox:after{right:6px;bottom:6px;border-left:0;border-top:0}
#name{position:absolute;left:32px;top:-16px;padding:4px 18px 5px;background:linear-gradient(#a8342a,#7d211a);
  border:1px solid #d9b478;border-radius:2px;font-family:"Ma Shan Zheng",serif;font-size:20px;letter-spacing:4px;color:#ffeccd;
  box-shadow:0 4px 12px rgba(0,0,0,.6)}
#name:empty{display:none}
#text{font-size:19px;line-height:1.92;letter-spacing:.6px;color:#efe4c8;text-shadow:0 1px 2px #000;min-height:100px}
#text em{font-style:normal;color:#e6c37a;font-weight:700;border-bottom:1px dotted rgba(230,195,122,.5);padding:0 2px}
#next{position:absolute;right:24px;bottom:10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:11px solid var(--gold);opacity:0;animation:nb 1.1s ease-in-out infinite}
#next.show{opacity:.95}
@keyframes nb{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* ---- 選項 ---- */
#choices{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:radial-gradient(ellipse at center,rgba(10,7,5,.45),rgba(10,7,5,.84));overflow:auto;padding:24px}
#choices.show{display:flex;animation:fi .35s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.ctitle{font-family:"Ma Shan Zheng",serif;font-size:25px;color:#e8d3a4;letter-spacing:4px;margin-bottom:6px;text-shadow:0 2px 8px #000;
  text-align:center;max-width:840px;line-height:1.8}
.ch{width:660px;padding:14px 24px;background:linear-gradient(90deg,rgba(30,22,16,.95),rgba(18,13,10,.95));
  border:1px solid rgba(194,160,92,.5);border-left:4px solid var(--gold2);color:#ecdfbe;font-size:18px;letter-spacing:1.5px;
  cursor:pointer;transition:.22s;text-align:left;font-family:inherit;border-radius:2px;flex:none}
.ch:hover{background:linear-gradient(90deg,rgba(74,54,30,.96),rgba(38,27,17,.96));border-left-color:var(--gold);
  color:#fff5dc;transform:translateX(8px);box-shadow:0 6px 22px rgba(0,0,0,.55)}
.ch small{display:block;font-size:12px;color:#9c8a67;letter-spacing:2px;margin-top:4px}
.ch.ok{border-left-color:#7fae8b;background:linear-gradient(90deg,rgba(40,66,48,.95),rgba(20,34,24,.95))}
.ch.no{border-left-color:#a8483c;background:linear-gradient(90deg,rgba(72,32,26,.95),rgba(36,18,15,.95))}

/* ---- 卷軸 / 卡片 ---- */
#ov{position:absolute;inset:0;z-index:55;display:none;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(8,6,4,.6),rgba(8,6,4,.9));cursor:pointer}
#ov.show{display:flex;animation:fi .4s ease both}
.scrollbox{position:relative;width:860px;max-height:604px;overflow:auto;padding:44px 52px;
  background:linear-gradient(#f0e4c6,#e2d3ae 60%,#d8c69c);color:#2a1f16;
  border-top:14px solid #6b4a2c;border-bottom:14px solid #6b4a2c;border-radius:3px;
  box-shadow:0 24px 70px rgba(0,0,0,.8),inset 0 0 60px rgba(140,105,55,.28);
  animation:unfurl .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes unfurl{from{transform:scaleY(.06);opacity:.2}to{transform:scaleY(1);opacity:1}}
.scrollbox h3{font-family:"Ma Shan Zheng",serif;font-size:29px;letter-spacing:8px;text-align:center;color:#7d211a;margin-bottom:6px}
.scrollbox .sub{text-align:center;font-size:13px;letter-spacing:5px;color:#7a6242;margin-bottom:20px;line-height:1.9}
.scrollbox .orig{font-family:"Ma Shan Zheng",serif;font-size:26px;line-height:2;text-align:center;color:#241a12;letter-spacing:3px}
.scrollbox .bd{font-size:16px;line-height:1.95;color:#3a2c1d}
.tbl{width:100%;border-collapse:collapse;margin-top:6px}
.tbl th,.tbl td{border:1px solid rgba(107,74,44,.45);padding:7px 11px;font-size:15px;line-height:1.7;text-align:left;vertical-align:top}
.tbl th{background:rgba(107,74,44,.16);font-weight:700;color:#5a3a1e;width:150px;letter-spacing:2px}
.sealst{position:absolute;right:20px;bottom:18px;width:50px;height:50px;border:3px solid #a8342a;color:#a8342a;
  font-family:"Ma Shan Zheng",serif;font-size:30px;display:flex;align-items:center;justify-content:center;
  border-radius:4px;transform:rotate(-8deg);opacity:.8;pointer-events:none}
.ovhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#bda97e;letter-spacing:4px;animation:nb2 1.4s infinite}
@keyframes nb2{0%,100%{opacity:.35}50%{opacity:1}}

/* ---- 章名 ---- */
#chapterCard{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(ellipse at center,#1a1410 0%,#080605 78%)}
#chapterCard.show{display:flex;animation:fi .6s ease both}
#chapterCard .enso{position:absolute;width:520px;height:520px;border:3px solid rgba(194,160,92,.22);border-radius:50%;
  border-right-color:transparent;border-bottom-color:rgba(194,160,92,.08);animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#chapterCard .no{font-size:15px;letter-spacing:12px;color:#9c8457;margin-bottom:14px}
#chapterCard .ti{font-family:"Ma Shan Zheng",serif;font-size:92px;letter-spacing:14px;color:#f0dfb4;text-shadow:0 0 40px rgba(194,160,92,.35);text-align:center}
#chapterCard .sb{font-size:15px;letter-spacing:5px;color:#a08d68;margin-top:18px;text-align:center;line-height:1.9;max-width:820px}
#chapterCard .ln{width:220px;height:1px;background:linear-gradient(90deg,transparent,#8d6f38,transparent);margin-top:20px}

/* ---- 視窗 ---- */
#modal{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(6,4,3,.86)}
#modal.show{display:flex;animation:fi .3s ease both}
.panel{width:1000px;height:600px;background:linear-gradient(#1c1510,#120d0a);border:1px solid #6d5a38;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),0 30px 80px rgba(0,0,0,.8);display:flex;flex-direction:column;border-radius:3px}
.phead{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid rgba(194,160,92,.3);
  background:linear-gradient(90deg,rgba(60,42,24,.5),transparent)}
.phead h2{font-family:"Ma Shan Zheng",serif;font-size:27px;letter-spacing:8px;color:#e6cf9c;font-weight:400}
.phead .x{margin-left:auto;cursor:pointer;color:#b7a278;font-size:22px;padding:0 8px;transition:.2s}
.phead .x:hover{color:#fff;transform:rotate(90deg)}
.pbody{flex:1;overflow:auto;padding:20px 24px}
.pbody::-webkit-scrollbar{width:9px}.pbody::-webkit-scrollbar-track{background:#0e0a08}
.pbody::-webkit-scrollbar-thumb{background:#5a4728;border-radius:4px}
.tabs{display:flex;gap:6px;padding:10px 22px 0;flex-wrap:wrap}
.tab{font-size:14px;letter-spacing:3px;padding:6px 14px;border:1px solid #54421f;color:#b09a70;cursor:pointer;border-radius:2px;transition:.2s}
.tab:hover{color:#ffeccd;border-color:#8d6f38}
.tab.on{background:linear-gradient(#a8342a,#7d211a);color:#ffeed0;border-color:#d9b478}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.slot{border:1px solid #54421f;background:linear-gradient(#221a13,#171009);padding:12px;cursor:pointer;transition:.2s;border-radius:3px;min-height:120px}
.slot:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.5)}
.slot .st{font-size:15px;color:#e2cf9f;letter-spacing:2px;margin-bottom:6px}
.slot .sd{font-size:12px;color:#8f7c58;line-height:1.8}
.slot .em{font-family:"Ma Shan Zheng",serif;font-size:18px;color:#5f4e31}
.logline{border-bottom:1px dashed rgba(194,160,92,.16);padding:9px 4px;font-size:15px;line-height:1.85;color:#cbb98f}
.logline b{color:#e0b96f;font-weight:700;margin-right:8px;letter-spacing:1px}
.cx{border:1px solid rgba(194,160,92,.25);margin-bottom:10px;background:linear-gradient(#1d1610,#150f0b);border-radius:3px}
.cx>.h{padding:11px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:16.5px;letter-spacing:2px;color:#e3d0a2}
.cx>.h:hover{background:rgba(194,160,92,.08)}
.cx>.h .dot{width:8px;height:8px;background:var(--gold);border-radius:50%;flex:none}
.cx.lock>.h{color:#6b5c42}.cx.lock>.h .dot{background:#3f3423}
.cx>.b{display:none;padding:4px 18px 16px;font-size:15px;line-height:1.95;color:#c6b48c;border-top:1px solid rgba(194,160,92,.14)}
.cx.open>.b{display:block}
.cx .b p{margin-bottom:8px}.cx .b .k{color:#e0b96f}.cx .b .r{color:#d08a7a}
.cx .b .tbl th,.cx .b .tbl td{color:#c6b48c;border-color:rgba(194,160,92,.25)}
.cx .b .tbl th{background:rgba(194,160,92,.1);color:#e0b96f}
.setrow{display:flex;align-items:center;gap:16px;padding:12px 4px;border-bottom:1px dashed rgba(194,160,92,.15);font-size:15px;color:#cbb98f;letter-spacing:2px}
.setrow label{width:120px;flex:none}
.setrow .tip{font-size:13px;color:#8f7c58;line-height:2;letter-spacing:1px}
input[type=range]{flex:1;accent-color:#c2a05c;height:4px}
input[type=text]{background:#0f0b08;border:1px solid #54421f;color:#efe0bd;padding:9px 12px;font-family:inherit;font-size:16px;border-radius:2px;letter-spacing:3px}
input[type=text]:focus{outline:none;border-color:var(--gold)}

/* ---- 標題 ---- */
#title{position:absolute;inset:0;z-index:90;display:flex;background:#0d0a08}
#title.hide{display:none}
#tbg{position:absolute;inset:0;opacity:.95}
#tbg svg{width:100%;height:100%}
#tmask{position:absolute;inset:0;background:radial-gradient(ellipse at 62% 45%,rgba(8,6,4,.15) 0%,rgba(8,6,4,.8) 75%)}
#tleft{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center}
.tenso{position:absolute;width:440px;height:440px;border:2px solid rgba(194,160,92,.2);border-radius:50%;
  border-left-color:transparent;animation:spin 40s linear infinite}
.tmain{text-align:center;position:relative}
.tmain .kick{font-size:14px;letter-spacing:14px;color:#b7a077;margin-bottom:20px}
.tmain h1{font-family:"Ma Shan Zheng",serif;font-size:128px;line-height:.98;letter-spacing:10px;color:#f3e3ba;
  text-shadow:0 0 60px rgba(194,160,92,.35),0 6px 20px rgba(0,0,0,.8);writing-mode:vertical-rl;display:inline-block}
.tmain .sub{margin-top:22px;font-size:16px;letter-spacing:9px;color:#c9b489}
.tseal{position:absolute;right:-70px;top:-6px;width:52px;height:52px;border:3px solid #a8342a;color:#a8342a;border-radius:4px;
  font-family:"Ma Shan Zheng",serif;font-size:30px;display:flex;align-items:center;justify-content:center;transform:rotate(-7deg);opacity:.85}
#tright{position:relative;z-index:2;width:390px;padding:0 46px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.tbtn{padding:13px 20px;background:linear-gradient(90deg,rgba(28,20,14,.9),rgba(16,11,8,.75));border:1px solid rgba(194,160,92,.34);
  color:#e3d0a2;font-size:18px;letter-spacing:8px;cursor:pointer;transition:.25s;font-family:inherit;border-radius:2px;text-align:left;
  display:flex;align-items:center;gap:12px}
.tbtn:before{content:"";width:16px;height:1px;background:var(--gold);transition:.25s}
.tbtn:hover{color:#fff4d8;border-color:var(--gold);background:linear-gradient(90deg,rgba(74,54,30,.95),rgba(30,21,14,.85));transform:translateX(-8px)}
.tbtn:hover:before{width:30px}
.tname{margin-bottom:22px}
.tname span{display:block;font-size:12px;letter-spacing:5px;color:#9c8457;margin-bottom:8px}
.tfoot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:3px;color:#6d5c42;z-index:3}

/* ---- 結局 ---- */
#ending{position:absolute;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:#0a0806}
#ending.show{display:flex}
.endbox{width:880px;max-height:640px;overflow:auto;text-align:center;padding:42px 54px;background:linear-gradient(#f0e4c6,#dccca4);color:#241a12;
  border-top:14px solid #6b4a2c;border-bottom:14px solid #6b4a2c;box-shadow:0 30px 90px rgba(0,0,0,.9);animation:unfurl .8s ease both;position:relative}
.endbox .rk{font-size:14px;letter-spacing:10px;color:#7a6242}
.endbox h2{font-family:"Ma Shan Zheng",serif;font-size:70px;letter-spacing:12px;color:#7d211a;margin:8px 0 4px}
.endbox .ep{font-size:16px;line-height:2.1;color:#3a2c1d;margin:16px 0 22px;text-align:left}
.endbox .ep em{font-style:normal;color:#8d2b21;font-weight:700}
.endstat{display:flex;justify-content:center;gap:24px;margin-bottom:22px;flex-wrap:wrap}
.endstat div{font-size:15px;color:#4a3a24;letter-spacing:2px}
.endstat b{display:block;font-family:"Ma Shan Zheng",serif;font-size:30px;color:#8d2b21}
.endbtns{display:flex;gap:12px;justify-content:center}
.endbtns button{padding:10px 26px;background:linear-gradient(#7d211a,#5c1712);border:1px solid #d9b478;color:#ffeed0;
  font-family:inherit;font-size:15px;letter-spacing:4px;cursor:pointer;border-radius:2px;transition:.2s}
.endbtns button:hover{background:linear-gradient(#a8342a,#7d211a);transform:translateY(-2px)}
#toast{position:absolute;left:50%;top:74px;transform:translateX(-50%) translateY(-16px);z-index:120;padding:9px 26px;
  background:linear-gradient(#2a1f16,#170f0b);border:1px solid var(--gold);color:#f0dfb4;font-size:14px;letter-spacing:4px;
  opacity:0;pointer-events:none;transition:.4s;border-radius:2px;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bgLayer" class="layer"></div>
  <canvas id="fx" class="layer" width="1280" height="720"></canvas>
  <div id="charLayer" class="layer"></div>
  <div id="grain" class="layer"></div>

  <div id="hud">
    <div class="stat" id="s_j"><b>0</b><i>敬</i></div>
    <div class="stat" id="s_x"><b>0</b><i>學</i></div>
    <div class="stat" id="s_w"><b>0</b><i>婉</i></div>
    <div class="stat" id="s_q"><b>0</b><i>謙</i></div>
  </div>
  <div id="menubar">
    <button class="mb" data-m="save">保存</button>
    <button class="mb" data-m="load">讀取</button>
    <button class="mb" data-m="log">回顧</button>
    <button class="mb" data-m="codex">禮典</button>
    <button class="mb" id="btnAuto">自動</button>
    <button class="mb" id="btnSkip">快進</button>
    <button class="mb" id="btnMusic">音樂</button>
    <button class="mb" data-m="set">設定</button>
    <button class="mb" id="btnTitle">標題</button>
  </div>

  <div id="dialog"><div id="dbox">
    <div id="name"></div><div id="text"></div><div id="next"></div>
  </div></div>
  <div id="choices"></div>
  <div id="ov"></div>
  <div id="chapterCard"><div class="enso"></div><div class="no"></div><div class="ti"></div><div class="ln"></div><div class="sb"></div></div>
  <div id="modal"><div class="panel">
    <div class="phead"><h2 id="mTitle">禮典</h2><div class="x" id="mClose">✕</div></div>
    <div class="tabs" id="mTabs"></div>
    <div class="pbody" id="mBody"></div>
  </div></div>

  <div id="title">
    <div id="tbg"></div><div id="tmask"></div>

/* ============================================================
   一、音樂（即時合成古琴氛圍）
============================================================ */
const Snd=(()=>{
  let ctx=null,master=null,on=true,drone=null;
  const PENT=[146.83,164.81,196.00,220.00,246.94,293.66,329.63,392.00,440.00,493.88];
  function init(){
    if(ctx)return;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.5,ctx.currentTime+2);
    drone=ctx.createGain();drone.gain.value=0.06;drone.connect(master);
    [73.42,110].forEach((f,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;
      const g=ctx.createGain();g.gain.value=i?0.5:0.8;o.connect(g);g.connect(drone);o.start();});
    loop();
  }
  function pluck(f,v,dur){
    if(!ctx||!on)return;v=v||0.5;dur=dur||3.2;
    const t=ctx.currentTime;
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2.005;
    lp.type='lowpass';lp.frequency.value=1800;lp.Q.value=0.6;
    const g2=ctx.createGain();g2.gain.value=0.22;o2.connect(g2);g2.connect(lp);
    o.connect(lp);lp.connect(g);g.connect(master);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.start(t);o2.start(t);o.stop(t+dur+0.1);o2.stop(t+dur+0.1);
  }
  function loop(){
    if(!ctx)return;
    setTimeout(()=>{
      if(on){pluck(PENT[Math.floor(Math.random()*PENT.length)],0.16+Math.random()*0.16,3.6);
        if(Math.random()<0.28)setTimeout(()=>pluck(PENT[Math.floor(Math.random()*6)]*0.5,0.13,4.4),420);}
      loop();
    },1600+Math.random()*3200);
  }
  return{
    init,
    toggle(){init();on=!on;if(master)master.gain.linearRampToValueAtTime(on?0.5:0,ctx.currentTime+0.5);return on;},
    isOn(){return on;},
    click(){init();pluck(880+Math.random()*120,0.09,0.5);},
    page(){init();if(!ctx||!on)return;const t=ctx.currentTime,b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.22),ctx.sampleRate);
      const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.4)*0.4;
      const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;
      s.connect(f);f.connect(master);s.start(t);},
    gong(){init();if(!ctx||!on)return;const t=ctx.currentTime;
      [65.4,98,131].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
        o.frequency.value=f*(1+i*0.004);o.connect(g);g.connect(master);
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.34/(i+1),t+0.03);
        g.gain.exponentialRampToValueAtTime(0.0005,t+4.5);o.start(t);o.stop(t+4.6);});},
    chime(){init();pluck(1174.66,0.16,2.2);setTimeout(()=>pluck(1567.98,0.1,2.4),140);},
    wrong(){init();if(!ctx||!on)return;pluck(110,0.2,1.2);setTimeout(()=>pluck(98,0.18,1.4),150);}
  };
})();

const cv=$('#fx'),cx2=cv.getContext('2d');let parts=[],fxCfg={t:'mist',c:'#fff'};
function setFX(c){fxCfg=c;parts=[];const n=c.t==='firefly'?26:c.t==='petal'?40:c.t==='dust'?46:c.t==='ember'?30:22;
  for(let i=0;i<n;i++)parts.push(mkP(true));}
function mkP(init){const t=fxCfg.t;return{x:Math.random()*1280,y:init?Math.random()*720:-20,
  r:t==='petal'?3+Math.random()*4:t==='firefly'?1.6+Math.random()*2:t==='dust'?1+Math.random()*2.4:t==='ember'?1.4+Math.random()*2.6:26+Math.random()*40,
  vy:t==='petal'?.5+Math.random()*1.1:t==='firefly'?(Math.random()-.5)*.35:t==='dust'?.16+Math.random()*.3:t==='ember'?-.35-Math.random()*.6:.1,
  vx:t==='petal'?(Math.random()-.5)*.9:t==='firefly'?(Math.random()-.5)*.4:(Math.random()-.5)*.3,
  a:Math.random()*6.28,va:(Math.random()-.5)*.05,ph:Math.random()*6.28,op:.2+Math.random()*.6};}
function tickFX(){
  cx2.clearRect(0,0,1280,720);
  const c=fxCfg.c,t=fxCfg.t;
  parts.forEach((p,i)=>{
    p.y+=p.vy;p.x+=p.vx+Math.sin(p.ph+=.012)*.32;p.a+=p.va;
    if(t==='mist'){p.x+=.2;if(p.x>1360)p.x=-80;}
    else if(p.y>740||p.y<-40||p.x<-40||p.x>1320){parts[i]=mkP(false);}
    cx2.save();cx2.translate(p.x,p.y);cx2.rotate(p.a);cx2.fillStyle=c;
    if(t==='petal'){cx2.globalAlpha=p.op*.85;cx2.beginPath();cx2.ellipse(0,0,p.r,p.r*.55,0,0,6.3);cx2.fill();}
    else if(t==='firefly'){cx2.globalAlpha=.25+Math.abs(Math.sin(p.ph*1.6))*.75;cx2.shadowBlur=14;cx2.shadowColor=c;
      cx2.beginPath();cx2.arc(0,0,p.r,0,6.3);cx2.fill();}
    else if(t==='mist'){cx2.globalAlpha=.05;cx2.filter='blur(12px)';cx2.beginPath();cx2.ellipse(0,0,p.r*2.4,p.r*.42,0,0,6.3);cx2.fill();}
    else{cx2.globalAlpha=p.op*.6;cx2.beginPath();cx2.arc(0,0,p.r,0,6.3);cx2.fill();}
    cx2.restore();
  });
  cx2.globalAlpha=1;requestAnimationFrame(tickFX);
}
setFX({t:'mist',c:'#fff6dd'});tickFX();

/* ★ 立繪座標（整體右移，避免左側被切） ★ */
const POSPX={L:420,C:700,R:980};
function posKey(p){
  p=String(p||'center').toLowerCase();
  if(p==='left'||p==='l')return 'L';
  if(p==='right'||p==='r')return 'R';
  return 'C';
}
const charState={};
function setChars(list){
  const layer=$('#charLayer');
  const want={};(list||[]).forEach(c=>{want[c[0]]={pos:c[1],em:c[2]||'normal'};});
  Object.keys(charState).forEach(k=>{if(!want[k]){const el=charState[k].el;el.classList.remove('on');
    delete charState[k];setTimeout(()=>{if(!el.classList.contains('on'))el.remove();},520);}});
  Object.keys(want).forEach(k=>{
    const w=want[k],pk=posKey(w.pos);
    let isNew=false;
    if(!charState[k]){const d=document.createElement('div');d.innerHTML=charSVG(k,w.em);
      layer.appendChild(d);charState[k]={el:d,em:w.em,pos:''};isNew=true;}
    const st=charState[k];
    st.el.style.left=POSPX[pk]+'px';                 /* 直接寫入，確保生效 */
    st.el.className='char on pos'+pk+(isNew?' pop':'');
    if(st.em!==w.em){st.el.innerHTML=charSVG(k,w.em);st.em=w.em;}
    st.pos=pk;
  });
}
function highlight(spKey){
  Object.keys(charState).forEach(k=>{charState[k].el.classList.toggle('dim',!!spKey&&k!==spKey);});
}

 '<p><span class="k">脈絡：</span>「禮樂崩壞」→「重新制定」。</p>'},
 {id:'sanli',n:'「三禮」',b:'<table class="tbl"><tr><th>名稱</th><th>內容</th></tr>'+
 '<tr><td>《周禮》</td><td>敘述周代的行政官制和職掌。（<span class="r">政治制度</span>）</td></tr>'+
 '<tr><td>《儀禮》</td><td>記述古代習俗禮儀。（<span class="r">禮俗</span>）</td></tr>'+
 '<tr><td>《禮記》</td><td>「<span class="r">禮的理論</span>」，是闡釋「禮」的論著。</td></tr></table>'+
 '<p style="margin-top:10px">※ 補充說明：《禮記》是戰國、秦漢間儒家論禮文章之集成，是闡釋「禮」的論著；漢代學者講授《儀禮》時，會選擇其中篇章作為補充資料。</p>'},
 {id:'content',n:'《禮記》的四類內容',b:'<p>1. 說明<span class="r">禮文制度</span>的原意。</p>'+
 '<p>2. 闡論<span class="r">淑世拯民</span>的道理。（較駁雜）</p>'+
 '<p>3. 記載<span class="r">祭祀、養老</span>的制度。</p>'+
 '<p>4. 敘述<span class="r">生活行為的規範</span>。（如〈曲禮〉）</p>'},
 {id:'book',n:'《禮記》成書過程',b:'<p><span class="k">源頭：</span>孔子與其弟子、後學。</p>'+
 '<p><span class="k">輯錄：</span>秦、漢間儒者纂集，共 <span class="r">131 篇</span>。</p>'+
 '<p><span class="k">西漢（漢宣帝時期）：</span></p>'+
 '<p>・<span class="r">戴德</span>選 85 篇 →《<span class="r">大戴禮記</span>》（亡）。</p>'+
 '<p>・<span class="r">戴聖</span>選 49 篇 →《<span class="r">小戴禮記</span>》，即今傳《禮記》。</p>'+
 '<p><span class="k">東漢：</span>鄭玄作<span class="r">注</span>。</p>'+
 '<p><span class="k">唐：</span>孔穎達作<span class="r">正義</span>，後被收於《<span class="r">十三經</span>》中，保存至今。</p>'+
 '<p><span class="k">※ 附記：</span>禮儀是由生活漸漸約定俗成，不可能由一人強制規定。</p>'}
]},
{cat:'三、吉凶之禮',items:[
 {id:'hun',n:'婚禮 · 昏禮',b:'<p>中國古代稱婚禮為<span class="r">「昏禮」</span>，因多在<span class="r">黃昏</span>舉行。</p>'+
 '<p>《禮記》對婚禮所做的規範化的表述：「<span class="r">昏禮者，將合二姓之好，上以事宗廟，而下以繼後世也，故君子重之。</span>」</p>'},
 {id:'liu',n:'三書六禮',b:'<p>《儀禮》將整套儀式合稱為「<span class="r">三書六禮</span>」。</p>'+
 '<p><span class="k">三書：</span>指在「六禮」過程中所用的文書，包括<span class="r">聘書、禮書和迎書</span>。</p>'+
 '<p><span class="k">六禮：</span>分別指<span class="r">納采、問名、納吉、納徵、請期、親迎</span>。</p>'+
 '<table class="tbl"><tr><th>納采</th><td>男方遣媒納雁為贄，正式提親。</td></tr>'+
 '<tr><th>問名</th><td>詢問女子之名與生辰，以備占卜。</td></tr>'+
 '<tr><th>納吉</th><td>卜得吉兆後告於女家，婚約初定。</td></tr>'+
 '<tr><th>納徵</th><td>致送聘禮，婚約正式成立。</td></tr>'+
 '<tr><th>請期</th><td>商定並告知迎娶吉日。</td></tr>'+
 '<tr><th>親迎</th><td>新郎親往女家迎娶，六禮乃成。</td></tr></table>'},
 {id:'sang',n:'喪禮 · 流程',b:'<p>傳統治喪儀制主要過程得以保留，但如喪儀、喪服制、孝服制等傳統已被<span class="r">「簡化」</span>，完整依儒家舊制者已鮮有見聞。</p>'+
 '<p><span class="k">喪禮流程：</span><span class="r">小殮 → 報喪 → 奔喪 → 停靈 → 守靈 → 大殮 → 出殯和下葬</span></p>'},
 {id:'qi',n:'做七 · 斷七',b:'<p><span class="k">燒七：</span>親友每七天去靈堂看望並燒紙錢，一共去七次，共<span class="r">四十九天</span>。還有類似的招魂、超渡、燒紙錢等活動，稱為「<span class="r">做七</span>」。</p>'+
 '<p>第四十九天的儀式稱為「<span class="r">斷七</span>」，為正式葬禮部分的結束。</p>'},
 {id:'shou',n:'守孝',b:'<p>按儒家的傳統實際服孝 <span class="r">3 期</span>，每期 <span class="r">9 個月</span>，共 <span class="r">27 個月</span>，孝子應該守護在父母墓的周圍。</p>'+
 '<p>服孝期間（實際上一般在百日內），<span class="k">不</span>剃頭、刮臉、剪指甲、飲酒、夫妻同房、外出等；逢春節或親友舉辦慶典，亦不拜禮和慶賀。家中女眷也要素妝。</p>'+
 '<p>現代社會若家中有喪事，第一年春節不去各家拜年。</p>'},
 {id:'fu',n:'喪服 · 五服制度',b:'<p>喪服：為哀悼死者而穿的服裝。中國古代喪服自<span class="r">周代</span>已用素服（素衣、素裳、素冠等），均取<span class="r">白色</span>。</p>'+
 '<p>並有<span class="k">五服制度</span>，即按<span class="r">服喪重輕、做工粗細、周期長短</span>，分為 5 等：</p>'+
 '<table class="tbl"><tr><th>斬衰</th><td>最重。粗麻不縫邊，服期三年。</td></tr>'+
 '<tr><th>齊衰</th><td>次重。麻布縫邊，服期依親疏而異。</td></tr>'+
 '<tr><th>大功</th><td>熟麻布製，服期九月。</td></tr>'+
 '<tr><th>小功</th><td>更細之熟麻布，服期五月。</td></tr>'+
 '<tr><th>緦麻</th><td>最輕。細麻布，服期三月。</td></tr></table>'}
]},
{cat:'四、曲禮六章',items:[
 {id:'qu',n:'〈曲禮〉題解',b:'<p><span class="k">一、</span>《禮記》首篇篇名。分上、下兩篇。以其篇記<span class="r">吉</span>（祭祀之禮）、<span class="r">凶</span>（逢凶事時所舉行的哀弔禮）、<span class="r">賓</span>（國際間的一種禮節）、<span class="r">軍</span>（軍中的禮儀）、<span class="r">嘉</span>（專指婚禮）五禮之事，明其委屈，故稱為「曲禮」。</p>'+
 '<p><span class="k">二、</span>多記禮文之細微曲折之處，尤其詳細於<span class="r">言語、飲食、灑掃、應對、進退</span>之法與日常舉止中。</p>'+
 '<p>※ 本課課文皆選自《禮記》中的〈曲禮〉，注重我們在生活上的表現。</p>'},
 {id:'ren',n:'克己復禮為仁',b:'<p>孔子曰：「<span class="r">克己復禮為仁</span>」。</p>'+
 '<p>「仁」的表現就在<span class="k">言語、飲食、灑掃、進退</span>之日常舉止中，就在<span class="k">事親、敬長、問學、交友</span>的行為儀節上，此乃儒家<span class="r">生活教育</span>的實踐。</p>'},
 {id:'q1',n:'曲禮一 · 毋不敬',b:'<p><span class="k">要旨：</span>待人接物的原則、一切行為的準則以「敬」為基礎。</p>'+
 '<p><span class="k">原文：</span>曲禮曰：毋不敬，儼若思，安定辭，安民哉！</p>'+
 '<p><span class="k">注釋：</span><br>・<span class="r">毋不敬</span>：禮莫切於敬，應事接物，無一時一事不可以不敬。敬，自我警惕約束之意。<br>'+
 '・<span class="r">儼若思</span>：儼通「嚴」，端莊持重。此言儀態端莊持重的樣子。<br>'+
 '・<span class="r">安定辭</span>：說話謹慎、心平氣和的樣子。安：態度平和。定：論點明確，不模稜兩可。辭：說話。</p>'+
 '<p><span class="k">語譯：</span>《曲禮》說：一切行為準則皆以「敬」為基礎，態度要端莊持重、若有所思的樣子，說話的時候亦要平和，論點明確、不模稜兩可。這樣才能夠使人信服。</p>'},
 {id:'q2',n:'曲禮二 · 人生百年',b:'<p><span class="k">要旨：</span>人生百年當中，各成長階段遵從禮制的不同要求。</p>'+
 '<p><span class="k">原文：</span>人生十年曰幼，學。二十曰弱，冠。三十曰壯，有室。四十曰強，而仕。五十曰艾，服官政。六十曰耆，指使。七十曰老，而傳。八十九十曰耄，七年曰悼。悼與耄，雖有罪不加刑焉。百年曰期，頤。</p>'+
 '<p><span class="k">注釋：</span><br>・<span class="r">冠</span>：古代二十歲行冠禮，表示成年，體猶未壯，故曰弱。<br>'+
 '・<span class="r">室</span>：家室，結婚後的小家庭。<br>'+
 '・<span class="r">仕</span>：為士治理官府小事，引申為為社會服務。<br>'+
 '・<span class="r">服官政</span>：可以為大夫，擔任國家重要的工作。<span class="r">艾</span>：經驗豐富，辦事老練。<br>'+
 '・<span class="r">耆</span>：音ㄑㄧˊ，衰老。<span class="r">指使</span>：六十始年老體衰，可藉經驗指導分派工作給別人。<br>'+
 '・<span class="r">傳</span>：七十告老不堪任事，把職責傳承交付後進。<br>'+
 '・<span class="r">耄</span>：音ㄇㄠˋ，衰老不再工作。<br>'+
 '・<span class="r">不加刑</span>：悼者因年少無知，耄者衰老安養而已，雖一時犯錯也不加刑罰。<span class="r">悼</span>：可憐愛的意思。<br>'+
 '・<span class="r">期</span>：指人生以百年為期，百歲時期已滿。<span class="r">頤</span>：音ㄧˊ，養也。人生百歲惟尊老安養而已。</p>'+
 '<p><span class="k">語譯：</span>人的一生，十歲時稱為「幼」，開始外出就學；到了二十歲時稱為「弱」，舉行加冠之禮；三十歲時稱作「壯」，已經結婚成立家室；四十歲時稱作「強」，可以出仕做小官；五十歲時稱作「艾」，可以執掌一方治理大眾之事；六十歲時稱作「耆」，能憑藉經驗指導別人做事；七十歲時稱為「老」，應把工作責任交付給後人；八十、九十歲時稱作「耄」。七歲以下的兒童被稱作「悼」。這些兒童和八十、九十歲的老人即使犯了罪，也不得施以刑罰。百歲稱作「期」，將得到社會的供養。</p>'},
 {id:'q3',n:'曲禮三 · 為人子者',b:'<p><span class="k">要旨：</span>為人子如何孝敬父母與尊事長者，此為<span class="r">家庭倫理</span>之規範。</p>'+
 '<p><span class="k">原文：</span>夫為人子者：出必告，反必面，所遊必有常，所習必有業。</p>'+
 '<p><span class="k">注釋：</span><br>・<span class="r">告</span>：稟告，指稟告父母。<br>・<span class="r">反</span>：通「返」，返回。<span class="r">面</span>：面見父母。<br>'+
 '・<span class="r">遊</span>：結交者。<span class="r">習</span>：修習者。「所遊必有常，所習必有業」：結交品行端正的朋友，修習課程有一定進度，使個人進德修業日益增長，父母就能安心。</p>'+
 '<p><span class="k">語譯：</span>為人子，出門必須將去處稟告父母，返回時也要先面見父母。結交品行端正的朋友，修習課程有一定進度，使個人進德修業日益增長，父母就能安心。</p>'},
 {id:'q4',n:'曲禮四 · 侍坐於先生',b:'<p><span class="k">要旨：</span>回答老師問題及向老師請教時的規矩。</p>'+
 '<p><span class="k">原文：</span>侍坐於先生：先生問焉，終則對。請業則起，請益則起。</p>'+
 '<p><span class="k">注釋：</span><br>・<span class="r">終則對</span>：指等問話終了後才能回答。<br>・<span class="r">業</span>：課業。<span class="r">起</span>：當起身請教老師。<br>'+
 '・<span class="r">益</span>：進一步說明，課業有所不明白的地方，須要老師更詳加解說。</p>'+
 '<p><span class="k">語譯：</span>侍候老師坐著時，老師發問，要等問話結束後再回答。課業有所不明白的地方，須要老師更詳加解說，當起身請教老師。</p>'},
 {id:'q5',n:'曲禮五 · 侍坐於君子',b:'<p><span class="k">要旨：</span>侍坐於君子面前時的規矩，生活禮儀的常規。</p>'+
 '<p><span class="k">原文：</span>侍坐於君子，君子欠伸，撰杖屨，視日蚤莫，侍坐者請出矣。</p>'+
 '<p><span class="k">注釋：</span><br>・<span class="r">侍坐</span>：陪伴長輩坐談。<br>・<span class="r">欠伸</span>：打呵欠伸懶腰。<br>'+
 '・<span class="r">撰杖屨</span>：撰，執持。尊長想找枴杖或拿鞋子。<br>・<span class="r">蚤莫</span>：早晚。尊長探問時間早晚。以上所指之事皆示尊長有倦意。</p>'+
 '<p><span class="k">語譯：</span>陪伴著長輩坐談，見尊長者打呵欠、伸懶腰，或想找枴杖或拿鞋子，或是探問時間早晚，侍坐者就該告辭退出。</p>'},
 {id:'q6',n:'曲禮六 · 君子全交',b:'<p><span class="k">要旨：</span>君子所應具的品德要求，進德修業的圭臬。</p>'+
 '<p><span class="k">原文：</span>博聞強識而讓，敦善行而不怠，謂之君子。君子不盡人之歡，不竭人之忠，以全交也。</p>'+
 '<p><span class="k">注釋：</span><br>・<span class="r">博聞強識而讓</span>：見聞廣博記憶力強，且能謙讓不自滿，則所學日益精。<br>'+
 '・<span class="r">敦善行而不怠</span>：修身踐言而力行不懈，則其德日益進。<br>'+
 '・<span class="r">不盡人之歡</span>：君子不討好別人，以求別人對己無盡的歡喜。<br>'+
 '・<span class="r">不竭人之忠</span>：君子也不期望別人，對自己全心全意的愛戴。竭：窮盡。<br>'+
 '・<span class="r">全交</span>：不勉強、不苛求，朋友之交才能長長久久。</p>'+
 '<p><span class="k">語譯：</span>見聞廣博記憶力強，且能謙讓不自滿，則所學日益精；修身踐言而力行不懈，則其德日益進。這就叫做君子。君子不討好別人，以求別人對己無盡的歡喜；君子也不期望別人，對自己全心全意的愛戴。不勉強、不苛求，朋友之交才能長長久久。</p>'},
 {id:'dao',n:'問題討論 · 悼與耄不加刑',b:'<p>「悼與耄，雖有罪不加刑焉。」——七歲以下之兒童與八十九十之老人，雖有罪不加刑罰。</p>'+
 '<p><span class="k">問題討論：</span>未成年犯罪與老年人犯罪，是不是可以從輕或減輕處罰？</p>'+
 '<p><span class="k">禮的精神：</span>悼者<span class="r">年少無知</span>，耄者<span class="r">衰老安養</span>而已，故憫幼恤老、教化為先。</p>'+
 '<p><span class="k">現代思考：</span>現代法制對於未成年與高齡者另有保護、減責與教化處遇之設計，但仍須兼顧<span class="r">被害人權益、社會正義與行為人的責任能力</span>，不可一概而論。「禮」提供的是價值取向，而非取代法律的判斷標準。</p>'}
]},
{cat:'五、禮之今用',items:[
 {id:'sum',n:'〈曲禮〉重點總結',b:'<p>〈曲禮〉內容蘊含<span class="r">親職教育、倫理教育、性別教育</span>等面向，內容包含從<span class="k">個人修身、生活常規、待人接物、家庭倫理</span>，進而擴展至<span class="k">生命的實踐</span>，正可提供現今家庭教育的參考。</p>'+
 '<table class="tbl"><tr><th>一</th><td>尊師敬長之禮</td></tr><tr><th>二</th><td>孝親之禮</td></tr><tr><th>三</th><td>拜訪與待客之禮</td></tr></table>'},
 {id:'four',n:'曲禮四大精神',b:'<p><span class="k">一、尊重和謙讓：</span>強調在待人接物中應謙虛有禮，如「毋不敬，儼若思」提倡謹慎和敬重他人。</p>'+
 '<p><span class="k">二、守禮與規範：</span>通過規定具體行為方式，讓人們在日常生活中遵守禮法，防止隨意和無序的行為。</p>'+
 '<p><span class="k">三、尊卑有序：</span>強調長幼尊卑的倫理秩序，例如「長者先，幼者後」，提倡按照身份和地位行事，維持社會穩定。</p>'+
 '<p><span class="k">四、自律與內省：</span>勉勵人們約束自己的行為，保持自律，並經常反省自身，以達到道德提升。</p>'},
 {id:'now',n:'禮的現代意義',b:'<p><span class="k">一、</span>強調禮儀標準和行為規範，對現代社會建立良好的<span class="r">社會秩序和規範</span>具有重要啟示。</p>'+
 '<p><span class="k">二、</span>強調倫理道德和內在修養，對於現代社會培養<span class="r">良好公民和個人品格</span>具有積極意義。</p>'+
 '<p><span class="k">三、</span>蘊含豐富的思想內涵和生活智慧，對於當代社會的<span class="r">精神追求和價值觀</span>提供了重要的參考。</p>'},
 {id:'apply',n:'曲禮在現代社會生活中的應用',b:'<table class="tbl"><tr><th>尊重他人</th><td>職場中、日常溝通、公共場合、社交媒體。</td></tr>'+

/* ============================================================
   六、引擎
============================================================ */
let idx=0,typing=false,typeTimer=null,curText='',autoOn=false,skipOn=false;
let stat={j:0,x:0,w:0,q:0},quizRight=0,quizTotal=0;
let log=[],unlocked={},settings={speed:26,autoWait:1400};

function applyFx(fx){if(!fx)return;let changed=false;
  Object.keys(fx).forEach(k=>{if(stat[k]!==undefined){stat[k]+=fx[k];changed=true;
    const el=$('#s_'+k);if(el){el.querySelector('b').textContent=stat[k];el.classList.remove('up');void el.offsetWidth;el.classList.add('up');}}});
  if(changed)Snd.chime();}
function doUnlock(u){if(!u)return;const add=(u instanceof Array)?u:[u];let newly=[];
  add.forEach(id=>{if(!unlocked[id]){unlocked[id]=1;newly.push(id);}});
  if(newly.length){let nm='';
    CODEX.forEach(c=>c.items.forEach(i=>{if(i.id===newly[0])nm=i.n;}));
    toast('禮 典 新 增 ：'+(nm||newly[0]));}}
function unlockedCount(){return Object.keys(unlocked).length;}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600);}

function setSpeaker(sp){
  const n=$('#name');
  if(!sp||sp==='n'){n.textContent='';}
  else if(sp==='you'){n.textContent=PNAME;}
  else n.textContent=NAME[sp]||'';
  highlight(sp==='n'?'':sp);
}
function typeOut(txt,cb){
  const el=$('#text');typing=true;el.innerHTML='';curText=fmt(txt);
  const raw=curText,tokens=[];let buf='',i=0;
  for(let k=0;k<raw.length;k++){const c=raw[k];
    if(c==='<'){const e=raw.indexOf('>',k);if(e<0){tokens.push(c);}else{tokens.push(raw.slice(k,e+1));k=e;}}
    else tokens.push(c);}
  clearInterval(typeTimer);
  typeTimer=setInterval(()=>{
    buf+=tokens[i];i++;el.innerHTML=buf;
    if(i>=tokens.length){clearInterval(typeTimer);typing=false;$('#next').classList.add('show');if(cb)cb();}
  },settings.speed);
  el._full=curText;
}
function showNode(i){
  if(i>=S_.length)return showEnding();
  idx=i;const n=S_[i];
  if(n.bg)setBG(n.bg);
  if(n.chars!==undefined&&n.chars!==null)setChars(n.chars);
  if(n.fx)applyFx(n.fx);
  if(n.unlock)doUnlock(n.unlock);
  if(n.chapter)return showChapter(n.chapter,i);
  if(n.scroll)return showScroll(n.scroll,i);
  if(n.card)return showCard(n.card,i);
  if(n.choices)return showChoices(n.choices,i);
  if(n.quiz)return showQuiz(n.quiz,i);
  if(n.end)return showEnding();
  if(!n.t){showNode(i+1);return;}
  setSpeaker(n.sp);
  log.push({sp:(n.sp==='you'?PNAME:(NAME[n.sp]||'')),t:plain(n.t)});
  if(log.length>260)log.shift();
  typeOut(n.t,()=>{
    if(autoOn)setTimeout(()=>{if(autoOn&&!typing)advance();},settings.autoWait+(n.t||'').length*22);
    if(skipOn)setTimeout(()=>{if(skipOn)advance();},55);});
}
function advance(){
  if(typing){clearInterval(typeTimer);$('#text').innerHTML=$('#text')._full||curText;typing=false;$('#next').classList.add('show');return;}
  Snd.click();showNode(idx+1);
}
function showChapter(c,i){
  const el=$('#chapterCard');
  el.querySelector('.no').textContent=c.n;
  el.querySelector('.ti').textContent=c.t;
  el.querySelector('.sb').textContent=c.s;
  el.classList.add('show');Snd.gong();
  setTimeout(()=>{el.classList.remove('show');showNode(i+1);},2700);
}
function showScroll(s,i){
  const ov=$('#ov');
  ov.innerHTML='<div class="scrollbox"><h3>'+fmt(s.t)+'</h3><div class="sub">'+fmt(s.s)+'</div>'+
    '<div class="orig">'+s.lines.map(fmt).join('<br>')+'</div><div class="sealst">禮</div></div>'+
    '<div class="ovhint">點 擊 繼 續</div>';
  ov.classList.add('show');ov.onclick=()=>{ov.classList.remove('show');Snd.page();showNode(i+1);};
  Snd.gong();
}
function showCard(c,i){
  const ov=$('#ov');
  const rows=c.rows.map(r=>'<tr><th>'+fmt(r[0])+'</th><td>'+fmt(r[1])+'</td></tr>').join('');
  ov.innerHTML='<div class="scrollbox"><h3>'+fmt(c.t)+'</h3><div class="sub">'+fmt(c.s||'')+'</div>'+
    '<div class="bd"><table class="tbl">'+rows+'</table></div><div class="sealst">記</div></div>'+
    '<div class="ovhint">點 擊 繼 續</div>';
  ov.classList.add('show');ov.onclick=()=>{ov.classList.remove('show');Snd.page();showNode(i+1);};
  Snd.page();
}
function showChoices(list,i){
  setSpeaker('');$('#text').innerHTML='';$('#name').textContent='';$('#next').classList.remove('show');
  const box=$('#choices');
  box.innerHTML='<div class="ctitle">— 請 擇 一 而 行 —</div>'+
    list.map((c,k)=>'<button class="ch" data-k="'+k+'">'+fmt(c.t)+(c.tip?'<small>'+c.tip+'</small>':'')+'</button>').join('');
  box.classList.add('show');
  [].forEach.call(box.querySelectorAll('.ch'),b=>{b.onclick=e=>{e.stopPropagation();
    const c=list[+b.getAttribute('data-k')];Snd.chime();
    log.push({sp:PNAME,t:plain(c.t)});
    box.classList.remove('show');applyFx(c.fx);
    $('#text').innerHTML='<em>▸ '+fmt(c.t)+'</em>';
    setTimeout(()=>showNode(i+1),640);};});
}
function showQuiz(q,i){
  quizTotal++;
  $('#name').textContent='考 題';$('#next').classList.remove('show');$('#text').innerHTML='';
  const box=$('#choices');
  const order=q.o.map((o,k)=>({o:o,k:k})).sort(()=>Math.random()-0.5);
  box.innerHTML='<div class="ctitle">'+fmt(q.q)+'</div>'+
    order.map(x=>'<button class="ch" data-k="'+x.k+'">'+fmt(x.o[0])+'</button>').join('');
  box.classList.add('show');
  [].forEach.call(box.querySelectorAll('.ch'),b=>{b.onclick=e=>{e.stopPropagation();
    const x=order[+b.getAttribute('data-k')];const ok=x.o[1];
    [].forEach.call(box.querySelectorAll('.ch'),bb=>{bb.style.pointerEvents='none';});
    b.classList.add(ok?'ok':'no');
    if(ok){quizRight++;stat.x+=2;$('#s_x').querySelector('b').textContent=stat.x;
      $('#s_x').classList.remove('up');void $('#s_x').offsetWidth;$('#s_x').classList.add('up');Snd.chime();}
    else{Snd.wrong();[].forEach.call(box.querySelectorAll('.ch'),bb=>{if(order[+bb.getAttribute('data-k')].o[1])bb.classList.add('ok');});}
    log.push({sp:'考題',t:plain(q.q)+' → '+(ok?'答對':'答錯')});
    idx=i;
    setTimeout(()=>{
      box.classList.remove('show');
      $('#name').textContent='解 說';
      typeOut((ok?'◎ 答對了。':'✕ 再想想。')+' '+q.exp,()=>{
        if(autoOn)setTimeout(()=>{if(autoOn&&!typing)advance();},settings.autoWait+900);
        if(skipOn)setTimeout(()=>{if(skipOn)advance();},60);});
    },1150);
  };});
}

/* ---- 結局 ---- */
function showEnding(){
  autoOn=skipOn=false;$('#btnAuto').classList.remove('act');$('#btnSkip').classList.remove('act');
  const tot=stat.j+stat.x+stat.w+stat.q;
  let rank,ep;
  if(quizRight>=11&&stat.j>=24&&stat.w>=22){rank='大 成 之 器';
    ep='夫子親書「大成之器」四字贈你。他說：禮之為道，你已不只是記得，而是活在了身上。<br><br>那日竹林，蘇婉煮了一壺茶。她說：「以後每年今日，我都會在這裡。」<br>你答：「好。這便是我們的『請期』。」';}
  else if(quizRight>=9&&stat.x>=26){rank='博 聞 君 子';
    ep='「博聞強識而讓，敦善行而不怠，謂之君子。」<br>夫子以〈曲禮〉之言評你：所學日益精，所記日益廣。<br>唯願你更進一層——把「讓」字，也讀進骨子裡。';}
  else if(stat.j>=26){rank='敦 善 之 士';
    ep='你的「敬」，眾人皆見。出必告、反必面，侍坐則終則對，交友則不盡其歡。<br>夫子說：學問可以慢慢補，這份不肯輕慢人的心，最難得。';}
  else if(quizRight>=7&&tot>=60){rank='循 禮 之 士';
    ep='你循規蹈矩，進退有度，已可謂知禮之人。<br>只是夫子提醒你：禮貴在「誠」，不在「熟」。下一步，是把儀節背後的*心意*，也一併接住。';}
  else{rank='待 琢 之 璞';
    ep='「玉不琢，不成器。」<br>你入門時日尚短，許多儀節還生疏，許多義理還未透。<br>但夫子說：肯坐下、肯提問、肯承認自己不懂——這已是「毋不敬」的開端。明年，再來。';}
  $('#eStat').innerHTML=[['敬',stat.j],['學',stat.x],['婉',stat.w],['謙',stat.q],['答對',quizRight+' / '+quizTotal],['禮典',unlockedCount()+' / '+ALL_IDS.length]]
    .map(s=>'<div><b>'+s[1]+'</b>'+s[0]+'</div>').join('');
  $('#eRank').textContent=rank;$('#eText').innerHTML=fmt(ep);
  $('#ending').classList.add('show');Snd.gong();
  saveTo('auto',true);
}

/* ---- 存檔 / 讀檔 ---- */
const KEY='liji_galgame_v1';
function saveTo(slot,silent){
  let chapNode={chapter:{n:'',t:''}};
  for(let k=idx;k>=0;k--){if(S_[k].chapter){chapNode=S_[k];break;}}
  const d={idx:idx,stat:stat,quizRight:quizRight,quizTotal:quizTotal,log:log.slice(-160),
    unlocked:Object.keys(unlocked),name:PNAME,chap:chapNode.chapter,ts:new Date().toLocaleString('zh-TW')};
  const all=JSON.parse(localStorage.getItem(KEY)||'{}');all[slot]=d;
  localStorage.setItem(KEY,JSON.stringify(all));
  if(!silent)toast('已 保 存 至 卷 '+slot);
}
function loadFrom(slot){
  const all=JSON.parse(localStorage.getItem(KEY)||'{}');
  if(!all[slot]){toast('此 卷 尚 無 記 錄');return false;}
  const d=all[slot];idx=d.idx;stat=d.stat;quizRight=d.quizRight||0;quizTotal=d.quizTotal||0;
  log=d.log||[];unlocked={};(d.unlocked||[]).forEach(id=>{unlocked[id]=1;});
  PNAME=d.name||'子衿';
  ['j','x','w','q'].forEach(k=>$('#s_'+k).querySelector('b').textContent=stat[k]);
  $('#pname').value=PNAME;closeModal();
  $('#title').classList.add('hide');$('#ending').classList.remove('show');
  curBg=null;Object.keys(charState).forEach(k=>{charState[k].el.remove();delete charState[k];});
  showNode(idx);toast('已 讀 取 卷 '+slot);return true;
}

/* ---- 視窗 ---- */
function openModal(kind){
  const m=$('#modal'),t=$('#mTitle'),b=$('#mBody'),tabs=$('#mTabs');
  tabs.innerHTML='';b.innerHTML='';m.classList.add('show');
  if(kind==='save'||kind==='load'){
    t.textContent=kind==='save'?'保 存 卷 軸':'讀 取 卷 軸';
    const all=JSON.parse(localStorage.getItem(KEY)||'{}');
    b.innerHTML='<div class="slots">'+[1,2,3,4,5,6].map(s=>{const d=all[s];
      return '<div class="slot" data-s="'+s+'">'+(d
        ? '<div class="st">卷 '+s+' · '+(d.chap.n||'')+' '+(d.chap.t||'')+'</div><div class="sd">'+d.ts+'<br>敬 '+d.stat.j+'　學 '+d.stat.x+'　婉 '+d.stat.w+'　謙 '+d.stat.q+'<br>禮典 '+((d.unlocked||[]).length)+' / '+ALL_IDS.length+'</div>'
        : '<div class="st">卷 '+s+'</div><div class="em">— 空 白 卷 軸 —</div>')+'</div>';}).join('')+'</div>';
    [].forEach.call(b.querySelectorAll('.slot'),el=>{el.onclick=()=>{const s=el.getAttribute('data-s');
      Snd.click();if(kind==='save')saveTo(s);else loadFrom(s);};});
  }
  else if(kind==='log'){
    t.textContent='回 顧 · 前 情';
    b.innerHTML=log.length?log.map(l=>'<div class="logline">'+(l.sp?'<b>'+l.sp+'</b>':'')+l.t+'</div>').join(''):'<div class="logline">尚無記錄。</div>';
    b.scrollTop=b.scrollHeight;
  }
  else if(kind==='codex'){
    t.textContent='禮 典 · 知 識 庫';
    tabs.innerHTML=CODEX.map((c,i)=>'<div class="tab'+(i===0?' on':'')+'" data-i="'+i+'">'+c.cat+'</div>').join('');
    const render=i=>{const c=CODEX[i];
      b.innerHTML='<div style="font-size:13px;color:#8f7c58;letter-spacing:3px;margin-bottom:12px">已習得 '+unlockedCount()+' / '+ALL_IDS.length+' 條</div>'+
      c.items.map(it=>{const ok=!!unlocked[it.id];
        return '<div class="cx'+(ok?'':' lock')+'"><div class="h"><span class="dot"></span>'+(ok?it.n:'尚未習得 · 待劇情解鎖')+'</div>'+(ok?'<div class="b">'+it.b+'</div>':'')+'</div>';}).join('');
      [].forEach.call(b.querySelectorAll('.cx:not(.lock) .h'),h=>{h.onclick=()=>{h.parentElement.classList.toggle('open');Snd.click();};});};
    [].forEach.call(tabs.querySelectorAll('.tab'),tb=>{tb.onclick=()=>{
      [].forEach.call(tabs.querySelectorAll('.tab'),x=>x.classList.remove('on'));
      tb.classList.add('on');render(+tb.getAttribute('data-i'));Snd.click();};});
    render(0);
  }
  else if(kind==='set'){
    t.textContent='設 定';
    b.innerHTML='<div class="setrow"><label>文字速度</label><input type="range" id="rSpeed" min="6" max="70" value="'+(80-settings.speed)+'"><span id="vSpeed" style="width:80px"></span></div>'+
    '<div class="setrow"><label>自動等待</label><input type="range" id="rAuto" min="400" max="3600" step="100" value="'+settings.autoWait+'"><span id="vAuto" style="width:80px"></span></div>'+
    '<div class="setrow"><label>音樂</label><button class="mb" id="sMusic">'+(Snd.isOn()?'開 啟 中':'已 靜 音')+'</button></div>'+
    '<div class="setrow"><label>學生姓名</label><input type="text" id="sName" maxlength="6" value="'+PNAME+'"></div>'+
    '<div class="setrow"><label>操作方式</label><span class="tip">點擊對話框或按空白鍵：推進劇情<br>按住「控制」鍵：快進<br>視窗開啟時按「結束」鍵：關閉</span></div>';
    const rs=$('#rSpeed'),ra=$('#rAuto');
    const upd=()=>{$('#vSpeed').textContent=(80-rs.value)+' 字／秒';$('#vAuto').textContent=(ra.value/1000).toFixed(1)+' 秒';};
    rs.oninput=()=>{settings.speed=80-rs.value;upd();};ra.oninput=()=>{settings.autoWait=+ra.value;upd();};upd();
    $('#sMusic').onclick=()=>{const on=Snd.toggle();$('#sMusic').textContent=on?'開 啟 中':'已 靜 音';$('#btnMusic').classList.toggle('act',on);};
    $('#sName').onchange=e=>{PNAME=(e.target.value||'').trim()||'子衿';};
  }
  else if(kind==='about'){
    t.textContent='本 作 說 明';
    b.innerHTML='<div class="cx open"><div class="h"><span class="dot"></span>關於本作</div><div class="b">'+
    '<p>本作為依據《禮記》選（〈曲禮〉）教材與「禮之概談」補充講義編撰之<span class="k">古風視覺小說</span>。</p>'+
    '<p><span class="k">劇情結構：</span>序章（禮之定義）→ 字源 → 禮之用 → 禮樂崩壞 → 三禮成書 → 昏禮 → 喪禮 → 曲禮六章 → 總結與今用 → 結業大考。</p>'+
    '<p><span class="k">數值系統：</span>敬（恭敬自律）、學（學識）、婉（蘇婉好感）、謙（同窗情誼）。選擇與答題皆會影響數值，並決定結業評第與結局。</p>'+
    '<p><span class="k">禮典：</span>隨劇情自動收錄知識條目，可隨時查閱複習，共 '+ALL_IDS.length+' 條。</p>'+
    '<p><span class="k">結局：</span>大成之器／博聞君子／敦善之士／循禮之士／待琢之璞。</p>'+
    '<p><span class="k">操作：</span>點擊對話框或按空白鍵推進；按住「控制」鍵快進；「自動」鈕可自動演進；「音樂」鈕可開關琴音。</p>'+
    '<p style="color:#8f7c58">※ 琴音為瀏覽器即時合成之古琴泛音，無外部音檔。</p></div></div>';
  }
}

$('#btnSkip').onclick=()=>{skipOn=!skipOn;autoOn=false;$('#btnSkip').classList.toggle('act',skipOn);$('#btnAuto').classList.remove('act');
  Snd.click();toast(skipOn?'快 進 · 開':'快 進 · 關');if(skipOn&&!typing)setTimeout(()=>{if(skipOn)advance();},60);};
$('#btnMusic').onclick=()=>{const on=Snd.toggle();$('#btnMusic').classList.toggle('act',on);
  toast(on?'琴 音 · 起':'琴 音 · 歇');};
$('#btnTitle').onclick=()=>{Snd.click();if(confirm('返回標題？未保存的進度將遺失。'))location.reload();};

addEventListener('keydown',e=>{
  if(!$('#title').classList.contains('hide')){if(e.key==='Enter')$('#bStart').click();return;}
  if(e.key==='Escape'){if($('#modal').classList.contains('show'))closeModal();return;}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();
    if($('#ov').classList.contains('show')){$('#ov').click();return;}
    if($('#chapterCard').classList.contains('show'))return;
    if(!$('#choices').classList.contains('show'))advance();return;}
  if(e.key==='Control'&&!skipOn)$('#btnSkip').click();
});
addEventListener('keyup',e=>{if(e.key==='Control'&&skipOn)$('#btnSkip').click();});

/* ---- 標題畫面 ---- */
$('#tbg').innerHTML=SC.dawn;
$('#pname').oninput=e=>{PNAME=((e.target.value||'').trim()).slice(0,6)||'子衿';};
function startGame(fromLoad){
  Snd.init();Snd.gong();
  PNAME=(($('#pname').value||'').trim())||'子衿';
  $('#title').classList.add('hide');
  $('#btnMusic').classList.toggle('act',Snd.isOn());
  if(!fromLoad){idx=0;stat={j:0,x:0,w:0,q:0};log=[];unlocked={};quizRight=0;quizTotal=0;
    ['j','x','w','q'].forEach(k=>$('#s_'+k).querySelector('b').textContent=0);
    curBg=null;Object.keys(charState).forEach(k=>{charState[k].el.remove();delete charState[k];});}
  showNode(idx);
}
$('#bStart').onclick=()=>startGame(false);
$('#bCont').onclick=()=>{Snd.init();
  const all=JSON.parse(localStorage.getItem(KEY)||'{}');
  if(all.auto){const d=all.auto;
    PNAME=d.name||'子衿';$('#pname').value=PNAME;
    idx=d.idx;stat=d.stat;log=d.log||[];quizRight=d.quizRight||0;quizTotal=d.quizTotal||0;
    unlocked={};(d.unlocked||[]).forEach(id=>{unlocked[id]=1;});
    ['j','x','w','q'].forEach(k=>$('#s_'+k).querySelector('b').textContent=stat[k]);
    startGame(true);toast('續 讀 前 卷');}
  else toast('尚 無 存 檔 · 請 自 「始 入 書 院」 開 始');};
$('#bCodex').onclick=()=>{Snd.init();Snd.click();openModal('codex');};
$('#bSet').onclick=()=>{Snd.init();Snd.click();openModal('set');};
$('#bAbout').onclick=()=>{Snd.init();Snd.click();openModal('about');};
$('#eAgain').onclick=()=>location.reload();
$('#eCodex').onclick=()=>{Snd.click();openModal('codex');};

/* ---- 動畫 ---- */
const st=document.createElement('style');st.textContent=
'.mist{animation:drift 34s linear infinite}.mist.m2{animation-duration:46s;animation-direction:reverse}.mist.m3{animation-duration:28s}'+
'@keyframes drift{0%{transform:translateX(-90px)}50%{transform:translateX(90px)}100%{transform:translateX(-90px)}}'+
'.flame{animation:flick 1.6s ease-in-out infinite;transform-origin:center bottom}.flame.f2{animation-duration:2.1s;animation-delay:.3s}'+
'@keyframes flick{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.72;transform:scale(1.08) translateY(-2px)}}'+
'.smoke,.smoke2{animation:smk 9s ease-in-out infinite}@keyframes smk{0%{opacity:.06;transform:translateY(0)}50%{opacity:.24}100%{opacity:.06;transform:translateY(-26px)}}'+
'.beam{animation:bmp 8s ease-in-out infinite}.beam.b2{animation-duration:11s}@keyframes bmp{0%,100%{opacity:.1}50%{opacity:.19}}'+
'.lant{animation:sway 6.5s ease-in-out infinite;transform-origin:top center}.lant.l2{animation-duration:8s;animation-delay:-2s}'+
'@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}'+
'.glow{animation:gl 3.4s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.85}50%{opacity:.55}}'+
'.fly circle{animation:fl 4.6s ease-in-out infinite}.fly circle:nth-child(2n){animation-duration:6.2s}'+
'@keyframes fl{0%,100%{opacity:.15}50%{opacity:1}}'+
'.rip{animation:rpl 12s linear infinite}.rip.r1{animation-duration:16s}.rip.r2{animation-duration:20s}'+
'@keyframes rpl{0%{transform:translateX(0)}100%{transform:translateX(-80px)}}'+
'.cnd{animation:cndf 5s ease-in-out infinite}@keyframes cndf{0%,100%{opacity:1}50%{opacity:.86}}';
document.head.appendChild(st);
</script>
